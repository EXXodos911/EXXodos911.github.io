version: 2

# Monthly, one grouped PR for minor and patch updates per ecosystem; major
# updates arrive as separate PRs. CI validates each one before merging.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
